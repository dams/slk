name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # v2.13.0+ is required for go1.27 (which setup-go's "stable" now
  # resolves to); older binaries panic in go/types with "file requires
  # newer Go version go1.27". v2.14.0+ is required for go1.27.2, whose
  # export data v2.13.x cannot read ("export data version 5 is greater
  # than maximum supported version 4").
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.14.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install X11 headers (cgo dep of golang.design/x/clipboard)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build -ldflags="-s -w" -trimpath ./...

      - name: Test
        run: go test ./... -race

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install X11 headers (cgo dep of golang.design/x/clipboard)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # vendorHash is derived from go.mod/go.sum, so any dependency change
      # invalidates it. Without this the flake only breaks for whoever
      # runs `nix build` next.
      - name: Build the flake
        run: nix build .#slk --print-build-logs
